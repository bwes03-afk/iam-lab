spring.application.name=scim-service
server.port=8081
scim.token=${SCIM_TOKEN}
spring.application.name=acme-portal
server.port=8082
spring.security.oauth2.client.registration.okta.client-id=${PORTAL_CLIENT_ID}
spring.security.oauth2.client.registration.okta.client-secret=${PORTAL_CLIENT_SECRET}
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ORG_URL}/oauth2/default